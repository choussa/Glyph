name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# The editor's design exists to work around engine quirks, so it is exactly the
# code that rots when the engine is bumped. Both halves are typechecked and
# tested on every change; the editor is also production-built.
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glyph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glyph/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
